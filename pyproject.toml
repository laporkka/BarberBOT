[project]
name = "barberbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "laporkka", email = "alexsolodkiy2008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
